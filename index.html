<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nexora · Redimensionar imagen</title>
<style>
:root{--bg:#03040a;--panel:#0a0c18;--tile:#0f1226;--field:#070914;--line:#1f2446;--tx:#f4f6ff;--mut:#8f96b8;--c1:#18d6ee;--c2:#b052f5;--grad:linear-gradient(120deg,#18d6ee,#2f7cf5 42%,#a21cf0 78%,#d726e8);--soft:color-mix(in srgb,var(--c2) 16%,transparent);--ok:#4ade80;--err:#f87171}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(800px 420px at 8% -8%,#18d6ee24,transparent),radial-gradient(800px 420px at 100% 0,#a21cf02e,transparent),var(--bg);background-attachment:fixed;color:var(--tx);font:16px/1.55 "Segoe UI",system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px)}
header{padding:36px 24px 24px;max-width:1200px;margin:auto}
h1{font-size:clamp(2.1rem,6vw,3.8rem);line-height:1.05;margin:0 0 12px;letter-spacing:-.03em;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
header p{max-width:62ch;color:var(--mut);margin:0}
main{max-width:1200px;margin:auto;padding:0 24px 60px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;align-items:start}
@media(max-width:900px){main{grid-template-columns:1fr}}
.top{border-bottom:1px solid #a050f040;background:#0a0612b8;backdrop-filter:blur(8px)}
.top div{max-width:1200px;margin:0 auto;padding:14px 24px}
.brand{display:inline-flex;flex-direction:column;gap:6px;text-decoration:none;transition:opacity .15s,transform .15s}
.brand:hover{opacity:.88;transform:translateY(-1px)}
.brand b{font:italic 900 1.85rem/1 "Segoe UI",system-ui,sans-serif;letter-spacing:-.02em;color:#f4f2ff}
.brand b i{font-style:italic;background:linear-gradient(120deg,#a050f0,#d726e8);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{font-size:.6rem;letter-spacing:.34em;color:var(--mut);text-transform:uppercase}
footer{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;max-width:1200px;margin:0 auto;padding:26px 24px calc(40px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);text-align:center;color:var(--mut);font-size:.9rem}
footer a{justify-self:end;display:flex;transition:transform .15s}footer a:hover{transform:scale(1.12)}
footer b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
#drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;min-height:300px;border:2px dashed var(--c2);border-radius:20px;background:var(--soft);cursor:pointer;padding:30px;transition:.15s}
#drop.over,#drop:hover{background:color-mix(in srgb,var(--c1) 14%,transparent);border-color:var(--c1)}
#drop .ic{font-size:3rem}#drop h2{margin:0;font-size:1.5rem}#drop p{margin:0;color:var(--mut);font-size:.9rem}
#drop.mini{min-height:0;flex-direction:row;padding:14px;margin-bottom:16px}#drop.mini .ic{font-size:1.4rem}#drop.mini h2{font-size:1rem}#drop.mini p{display:none}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;color:var(--mut);font-size:.9rem;gap:10px;flex-wrap:wrap}
.lnk{background:none;border:0;color:var(--c1);cursor:pointer;font:inherit;padding:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--tile);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.thumb{height:150px;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(#14172e 0 25%,#0c0e1f 0 50%) 0 0/16px 16px;position:relative}
.thumb img{max-width:100%;max-height:100%;object-fit:contain}
.thumb .x{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:0;background:#000b;color:#fff;cursor:pointer}
.card .in{padding:10px 12px;font-size:.8rem;color:var(--mut);display:flex;flex-direction:column;gap:2px}
.card .in b{color:var(--tx);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .sv{color:var(--ok)}.card .sv.up{color:var(--err)}
.card button.dl{margin:0 12px 12px;padding:8px;border-radius:9px;border:1px solid var(--line);background:none;color:var(--tx);font:inherit;font-size:.85rem;cursor:pointer}
.card button.dl:hover{border-color:var(--c1)}
.panel{background:linear-gradient(var(--panel),var(--panel)) padding-box,var(--grad) border-box;border:1px solid transparent;border-radius:20px;padding:22px 20px 24px;position:sticky;top:16px;box-shadow:0 12px 44px #18d6ee14,0 -4px 30px #a21cf014;scrollbar-width:thin;scrollbar-color:var(--c2) transparent}
@media(min-width:901px){.panel{max-height:calc(100vh - 32px);overflow:auto}}
.panel h2{margin:0 0 4px;font-size:1.25rem}.sub{color:var(--mut);font-size:.9rem;margin:0 0 14px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:9px 4px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--mut);font:inherit;font-size:.82rem;cursor:pointer}
.tabs button.on{color:var(--tx);border-color:var(--c2);background:var(--soft)}
label.l{display:block;font-size:.8rem;color:var(--mut);margin:10px 0 4px}
input[type=number],input[type=text],select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--tx);font:inherit}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--c1);outline-offset:1px}
input[type=range]{width:100%;accent-color:var(--c2)}
input[type=color]{width:42px;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--field);padding:2px}
.row{display:flex;gap:8px;align-items:center}
.lock{flex:none;width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--mut);font-size:1.1rem;cursor:pointer}
.lock.on{border-color:var(--c1);color:var(--c1);background:var(--soft)}
.chk{display:flex;gap:8px;align-items:center;font-size:.88rem;margin:10px 0;cursor:pointer}
.chk input{accent-color:var(--c2);width:16px;height:16px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips button{padding:9px 8px;text-align:left;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--tx);font:inherit;font-size:.78rem;cursor:pointer;line-height:1.25}
.chips button small{display:block;color:var(--mut)}.chips button:hover{border-color:var(--c2)}
.tools{display:flex;gap:6px;margin-top:6px}
.tools button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--tx);font-size:1.05rem;cursor:pointer}
.tools button.on{border-color:var(--c1);background:var(--soft)}
.btn{width:100%;padding:13px;border:0;border-radius:12px;background:var(--grad);color:#07070d;font:inherit;font-weight:700;cursor:pointer;margin-top:16px}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--tx);font-weight:500;margin-top:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
#log{margin-top:12px;font-size:.86rem;color:var(--mut);min-height:1.3em}
.hide{display:none!important}
</style>
</head>
<body>
<nav class="top"><div>
  <a class="brand" id="brand" href="/" aria-label="Ir a la página principal de Nexora"><b>NEX<i>ORA</i></b><small>Tools &amp; Resources</small></a>
</div></nav>
<header>
  <h1>Redimensionar imagen</h1>
  <p>Cambia el tamaño de tus imágenes por píxeles, porcentaje o medidas para redes sociales. Todo se procesa en tu navegador: tus fotos nunca se suben a ningún servidor.</p>
</header>
<main>
  <section>
    <label id="drop" for="file"><span class="ic">🖼️</span><h2>Selecciona imágenes</h2><p>o arrástralas aquí · también puedes pegar con Ctrl+V<br>JPG, PNG, WebP, GIF, BMP, AVIF</p></label>
    <input id="file" type="file" accept="image/*" multiple hidden>
    <div id="list" class="hide">
      <div class="bar"><span id="count"></span><button class="lnk" id="clear" type="button">Quitar todas</button></div>
      <div class="grid" id="grid"></div>
    </div>
  </section>
  <aside class="panel">
    <h2>Opciones de tamaño</h2>
    <p class="sub">Los cambios se ven al instante.</p>
    <div class="tabs" id="tabs">
      <button data-m="px" class="on" type="button">Píxeles</button>
      <button data-m="pct" type="button">Porcentaje</button>
      <button data-m="pre" type="button">Redes</button>
    </div>

    <div id="m-px">
      <div class="row">
        <div style="flex:1"><label class="l" for="w">Ancho (px)</label><input id="w" type="number" min="1" max="16000"></div>
        <button class="lock on" id="lock" type="button" title="Mantener proporción" style="margin-top:20px">🔒</button>
        <div style="flex:1"><label class="l" for="h">Alto (px)</label><input id="h" type="number" min="1" max="16000"></div>
      </div>
      <label class="chk"><input type="checkbox" id="noEnl" checked> No ampliar si es más pequeña</label>
      <div id="fitBox" class="hide">
        <label class="l" for="fit">Cuando cambian las proporciones</label>
        <select id="fit">
          <option value="cover">Recortar (rellena todo el tamaño)</option>
          <option value="contain">Ajustar (con bordes de relleno)</option>
          <option value="stretch">Estirar (deforma la imagen)</option>
        </select>
        <div class="row" style="margin-top:10px"><label class="chk" style="margin:0;flex:1"><input type="checkbox" id="tr" checked> Fondo transparente</label><input type="color" id="bg" value="#000000" title="Color de relleno"></div>
      </div>
    </div>

    <div id="m-pct" class="hide">
      <label class="l" for="pct">Escala: <b id="pctv">50</b>%</label>
      <input type="range" id="pct" min="1" max="300" value="50">
      <div class="chips" style="margin-top:8px;grid-template-columns:repeat(4,1fr)">
        <button type="button" data-p="25">25%</button><button type="button" data-p="50">50%</button><button type="button" data-p="75">75%</button><button type="button" data-p="200">200%</button>
      </div>
    </div>

    <div id="m-pre" class="hide"><div class="chips" id="chips"></div></div>

    <label class="l">Girar y voltear</label>
    <div class="tools">
      <button type="button" id="rl" title="Girar a la izquierda">↺</button><button type="button" id="rr" title="Girar a la derecha">↻</button>
      <button type="button" id="fh" title="Voltear horizontal">⇆</button><button type="button" id="fv" title="Voltear vertical">⇅</button>
    </div>

    <label class="l" for="fmt">Formato de salida</label>
    <select id="fmt"><option value="orig">Mismo que el original</option><option value="image/jpeg">JPG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select>
    <div id="qBox"><label class="l" for="q">Calidad: <b id="qv">90</b>%</label><input type="range" id="q" min="10" max="100" value="90"></div>
    <label class="l" for="suffix">Sufijo del nombre</label>
    <input type="text" id="suffix" value="_nexora" maxlength="30">

    <button class="btn" id="dlAll" type="button" disabled>Descargar imágenes</button>
    <button class="btn ghost" id="more" type="button">Agregar más imágenes</button>
    <div id="log" role="status"></div>
  </aside>
</main>
<footer>
  <span></span>
  <span>Hecho por <b>NexoraUnk</b></span>
  <a href="https://www.youtube.com/@NexoraUkn" target="_blank" rel="noopener noreferrer" aria-label="Canal de YouTube de NexoraUnk" title="Mi canal de YouTube">
    <svg viewBox="0 0 28 20" width="28" height="20" aria-hidden="true"><rect width="28" height="20" rx="5" fill="#f00"/><path d="M11 5.5v9l8-4.5z" fill="#fff"/></svg>
  </a>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
/* ===== CONFIGURACIÓN ===== */
const CONFIG={HOME_URL:"https://nexoraunktools.blogspot.com"};
const PRESETS=[["YouTube miniatura",1280,720],["YouTube banner",2560,1440],["Instagram post",1080,1080],["Instagram historia",1080,1920],["TikTok",1080,1920],["Facebook portada",820,312],["X / Twitter post",1600,900],["Discord avatar",128,128],["Twitch banner",1200,480],["Favicon / icono",512,512],["HD",1280,720],["Full HD",1920,1080],["2K",2560,1440],["4K",3840,2160]];
const $=s=>document.querySelector(s);
$("#brand").href=CONFIG.HOME_URL||"/";
const S={mode:"px",w:"",h:"",lock:true,drv:"w",pct:50,fit:"cover",bg:"#000000",tr:true,noEnl:true,fmt:"orig",q:90,rot:0,fh:false,fv:false,suffix:"_nexora"};
let files=[],uid=0,timer,run=0;
const esc=t=>t.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fsz=b=>b>1048576?(b/1048576).toFixed(2)+" MB":Math.round(b/1024)+" KB";
const log=(t,c)=>{const e=$("#log");e.textContent=t||"";e.style.color=c||""};

/* ---- Entrada de archivos ---- */
function add(list){
  const imgs=[...list].filter(f=>f.type.startsWith("image/"));
  if(!imgs.length){log("No se encontraron imágenes válidas.","var(--err)");return}
  let pend=imgs.length;
  imgs.forEach(file=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{files.push({id:++uid,file,img,url,iw:img.naturalWidth,ih:img.naturalHeight,res:null});done()};
    img.onerror=()=>{URL.revokeObjectURL(url);log("No se pudo leer: "+file.name,"var(--err)");done()};
    img.src=url;
  });
  function done(){if(--pend)return;
    if(!S.w&&!S.h&&files[0]){S.w=files[0].iw;S.h=files[0].ih}
    sync();ui();schedule()}
}
$("#file").onchange=e=>{add(e.target.files);e.target.value=""};
$("#more").onclick=()=>$("#file").click();
["dragover","dragenter"].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();$("#drop").classList.add("over")}));
["dragleave","drop"].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();$("#drop").classList.remove("over")}));
document.addEventListener("drop",e=>{if(e.dataTransfer&&e.dataTransfer.files.length)add(e.dataTransfer.files)});
document.addEventListener("paste",e=>{const f=[...(e.clipboardData?e.clipboardData.files:[])];if(f.length)add(f)});
$("#clear").onclick=()=>{files.forEach(f=>{URL.revokeObjectURL(f.url);f.res&&URL.revokeObjectURL(f.res.url)});files=[];ui()};

/* ---- Cálculos ---- */
const sd=f=>S.rot%180?[f.ih,f.iw]:[f.iw,f.ih];
function target(f){
  const [sw,sh]=sd(f);let tw,th;
  if(S.mode==="pct"){tw=sw*S.pct/100;th=sh*S.pct/100}
  else{
    const W=+S.w||0,H=+S.h||0;
    if(S.lock){let k=1;if(S.drv==="w"&&W)k=W/sw;else if(H)k=H/sh;else if(W)k=W/sw;
      if(S.noEnl)k=Math.min(k,1);tw=sw*k;th=sh*k}
    else{tw=W||sw;th=H||sh;if(S.noEnl&&tw>sw&&th>sh){tw=sw;th=sh}}
  }
  return [Math.max(1,Math.round(tw)),Math.max(1,Math.round(th))];
}
function sync(){ /* mantiene el otro campo según la proporción de la primera imagen */
  if(S.mode!=="px"||!S.lock||!files[0])return;
  const [sw,sh]=sd(files[0]);
  if(S.drv==="w"&&S.w)S.h=Math.round(S.w*sh/sw);else if(S.h)S.w=Math.round(S.h*sw/sh);
  $("#w").value=S.w;$("#h").value=S.h;
}
const typeOf=f=>S.fmt==="orig"?(["image/jpeg","image/png","image/webp"].includes(f.file.type)?f.file.type:"image/png"):S.fmt;
const extOf=t=>t==="image/jpeg"?"jpg":t==="image/webp"?"webp":"png";

/* ---- Procesado ---- */
async function proc(f){
  const [sw,sh]=sd(f),[tw,th]=target(f),type=typeOf(f);
  const s=document.createElement("canvas");s.width=sw;s.height=sh;
  const x=s.getContext("2d");x.translate(sw/2,sh/2);x.rotate(S.rot*Math.PI/180);x.scale(S.fh?-1:1,S.fv?-1:1);x.drawImage(f.img,-f.iw/2,-f.ih/2);
  const c=document.createElement("canvas");c.width=tw;c.height=th;
  const g=c.getContext("2d");g.imageSmoothingEnabled=true;g.imageSmoothingQuality="high";
  if(!S.tr||type==="image/jpeg"){g.fillStyle=S.tr?"#ffffff":S.bg;g.fillRect(0,0,tw,th)}
  let dw=tw,dh=th,dx=0,dy=0;
  if(S.mode==="px"&&!S.lock&&S.fit!=="stretch"){
    const k=S.fit==="cover"?Math.max(tw/sw,th/sh):Math.min(tw/sw,th/sh);
    dw=sw*k;dh=sh*k;dx=(tw-dw)/2;dy=(th-dh)/2;
  }
  g.drawImage(s,dx,dy,dw,dh);
  const blob=await new Promise(r=>c.toBlob(r,type,S.q/100));
  if(!blob)throw new Error("Tamaño demasiado grande para el navegador");
  const base=f.file.name.replace(/\.[^.]+$/,"");
  return {blob,url:URL.createObjectURL(blob),w:tw,h:th,name:base+S.suffix+"."+extOf(type)};
}
function schedule(){clearTimeout(timer);timer=setTimeout(runAll,220)}
async function runAll(){
  const my=++run;if(!files.length)return;
  log("Procesando…");$("#dlAll").disabled=true;
  for(const f of files){
    try{const r=await proc(f);if(my!==run){URL.revokeObjectURL(r.url);return}
      f.res&&URL.revokeObjectURL(f.res.url);f.res=r;f.err=null}
    catch(e){f.err=e.message}
  }
  if(my!==run)return;
  render();
  const ok=files.filter(f=>f.res).length;
  $("#dlAll").disabled=!ok;
  log(files.some(f=>f.err)?"Algunas imágenes dieron error (tamaño demasiado grande).":"Listo ✓ · "+ok+" imagen(es) redimensionada(s).",files.some(f=>f.err)?"var(--err)":"var(--ok)");
}

/* ---- Interfaz ---- */
function ui(){
  const has=files.length>0;
  $("#list").classList.toggle("hide",!has);$("#drop").classList.toggle("mini",has);
  $("#drop h2").textContent=has?"Agregar más imágenes":"Selecciona imágenes";
  $("#dlAll").disabled=!has;$("#more").classList.toggle("hide",!has);
  $("#dlAll").textContent=files.length>1?"Descargar todas (ZIP)":"Descargar imagen";
  if(!has)log("");
  render();
}
function render(){
  $("#count").textContent=files.length+" imagen"+(files.length===1?"":"es");
  $("#dlAll").textContent=files.length>1?"Descargar todas (ZIP)":"Descargar imagen";
  $("#grid").innerHTML=files.map(f=>{
    const r=f.res,pc=r?Math.round((1-r.blob.size/f.file.size)*100):0;
    return `<div class="card"><div class="thumb"><img src="${r?r.url:f.url}" alt=""><button class="x" data-x="${f.id}" title="Quitar" type="button">✕</button></div>
    <div class="in"><b title="${esc(f.file.name)}">${esc(f.file.name)}</b>
    <span>${f.iw}×${f.ih} → <span style="color:var(--tx)">${r?r.w+"×"+r.h:"…"}</span></span>
    <span>${fsz(f.file.size)} → ${r?fsz(r.blob.size):"…"} ${r?`<span class="sv ${pc<0?"up":""}">(${pc>0?"−"+pc:"+"+(-pc)}%)</span>`:""}</span>
    ${f.err?`<span style="color:var(--err)">${esc(f.err)}</span>`:""}</div>
    <button class="dl" data-d="${f.id}" type="button" ${r?"":"disabled"}>Descargar</button></div>`}).join("");
}
$("#grid").onclick=e=>{
  const x=e.target.closest("[data-x]"),d=e.target.closest("[data-d]");
  if(x){const i=files.findIndex(f=>f.id==x.dataset.x),f=files[i];URL.revokeObjectURL(f.url);f.res&&URL.revokeObjectURL(f.res.url);files.splice(i,1);ui()}
  if(d){const f=files.find(f=>f.id==d.dataset.d);if(f&&f.res)save(f.res.blob,f.res.name)}
};
function save(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
$("#dlAll").onclick=async()=>{
  const ok=files.filter(f=>f.res);if(!ok.length)return;
  if(ok.length===1||typeof JSZip==="undefined"){ok.forEach((f,i)=>setTimeout(()=>save(f.res.blob,f.res.name),i*250));return}
  log("Creando ZIP…");const z=new JSZip(),used={};
  ok.forEach(f=>{let n=f.res.name;if(used[n]){const p=n.lastIndexOf(".");n=n.slice(0,p)+"_"+used[n]+n.slice(p)}used[f.res.name]=(used[f.res.name]||0)+1;z.file(n,f.res.blob)});
  save(await z.generateAsync({type:"blob"}),"nexora-imagenes.zip");log("ZIP descargado ✓","var(--ok)");
};

/* ---- Controles ---- */
function setMode(m){
  S.mode=m;
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
  $("#m-px").classList.toggle("hide",m!=="px");$("#m-pct").classList.toggle("hide",m!=="pct");$("#m-pre").classList.toggle("hide",m!=="pre");
  sync();schedule();
}
$("#tabs").onclick=e=>{const b=e.target.closest("button");if(b)setMode(b.dataset.m)};
$("#chips").innerHTML=PRESETS.map((p,i)=>`<button type="button" data-i="${i}">${p[0]}<small>${p[1]}×${p[2]}</small></button>`).join("");
$("#chips").onclick=e=>{const b=e.target.closest("button");if(!b)return;
  const p=PRESETS[b.dataset.i];S.w=p[1];S.h=p[2];S.lock=false;S.fit="cover";S.noEnl=false;
  $("#w").value=S.w;$("#h").value=S.h;$("#fit").value="cover";$("#noEnl").checked=false;lockUI();setMode("px")};
function lockUI(){$("#lock").classList.toggle("on",S.lock);$("#lock").textContent=S.lock?"🔒":"🔓";$("#fitBox").classList.toggle("hide",S.lock)}
$("#lock").onclick=()=>{S.lock=!S.lock;lockUI();sync();schedule()};
$("#w").oninput=e=>{S.w=e.target.value;S.drv="w";sync();schedule()};
$("#h").oninput=e=>{S.h=e.target.value;S.drv="h";sync();schedule()};
$("#noEnl").onchange=e=>{S.noEnl=e.target.checked;schedule()};
$("#fit").onchange=e=>{S.fit=e.target.value;schedule()};
$("#tr").onchange=e=>{S.tr=e.target.checked;schedule()};
$("#bg").oninput=e=>{S.bg=e.target.value;$("#tr").checked=S.tr=false;schedule()};
$("#pct").oninput=e=>{S.pct=+e.target.value;$("#pctv").textContent=S.pct;schedule()};
document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{S.pct=+b.dataset.p;$("#pct").value=S.pct;$("#pctv").textContent=S.pct;schedule()});
const rot=d=>{S.rot=(S.rot+d+360)%360;sync();schedule()};
$("#rl").onclick=()=>rot(-90);$("#rr").onclick=()=>rot(90);
$("#fh").onclick=e=>{S.fh=!S.fh;e.currentTarget.classList.toggle("on",S.fh);schedule()};
$("#fv").onclick=e=>{S.fv=!S.fv;e.currentTarget.classList.toggle("on",S.fv);schedule()};
$("#fmt").onchange=e=>{S.fmt=e.target.value;$("#qBox").classList.toggle("hide",S.fmt==="image/png");schedule()};
$("#q").oninput=e=>{S.q=+e.target.value;$("#qv").textContent=S.q;schedule()};
$("#suffix").oninput=e=>{S.suffix=e.target.value;schedule()};
lockUI();
</script>
</body>
</html>
